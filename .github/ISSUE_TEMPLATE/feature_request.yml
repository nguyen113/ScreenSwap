name: Feature request
description: Suggest an improvement to ScreenSwap.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please avoid including private document or
        window content in your request.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or limitation would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or workarounds.
    validations:
      required: false
