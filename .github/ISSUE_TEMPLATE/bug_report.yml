name: Bug report
description: Report an unexpected ScreenSwap behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include window titles, document
        contents, credentials, or other sensitive desktop information.
  - type: input
    id: version
    attributes:
      label: ScreenSwap version
      description: Include the app version from About.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 14.6"
    validations:
      required: true
  - type: input
    id: display-count
    attributes:
      label: Number of active displays
      placeholder: "e.g. 2"
    validations:
      required: true
  - type: textarea
    id: selected-displays
    attributes:
      label: Selected displays
      description: Describe the selected pair without including sensitive window content.
      placeholder: "e.g. Built-in Retina Display and external 4K display"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
